        // ── HOME SCREEN ────────────────────────────────────────────────
        function renderModules() {
            updateProgressCards();
            updateStatBar();
            renderReviseCheckboxes();
            const grid = document.getElementById('modulesGrid');
            grid.innerHTML = '';
            modulesData.forEach(module => {
                const pct         = Math.round((module.completedLessons / module.totalLessons) * 100);
                const modUnlocked = isModuleUnlocked(module.id);
                const isCompleted = modUnlocked && module.status === 'completed';
                const maxSec      = getMaxUnlockedSection(module.id);
                const lastSec     = Math.max(...module.lessons.map(l => l.section));
                const catColors   = { INTRODUCTION: '#E8720C', PRACTICE: '#0891b2', REVIEW: '#0F6E56', LESSON: '#7c3aed' };

                // Pre-compute: which lesson ID is the last (unlock key) in each section?
                const sectionLastId = {};
                module.lessons.forEach(l => { sectionLastId[l.section] = l.id; });

                // Build lesson list HTML grouped by section.
                let lessonsHtml = '';
                // For locked modules, build a separate express-lane HTML (last section only).
                let expressHtml  = '';
                const sectionNums = [...new Set(module.lessons.map(l => l.section))].sort((a, b) => a - b);

                sectionNums.forEach(secNum => {
                    const secLessons = module.lessons.filter(l => l.section === secNum);
                    const secLabel   = secLessons[0].categoryName;
                    const secCol     = catColors[secLessons[0].category] || '#7A6A55';
                    const isLastSec  = secNum === lastSec;

                    // For the full list (used when unlocked)
                    lessonsHtml += `<div style="margin-top:14px">
                        <div style="font-size:10px;font-weight:700;color:${secCol};text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">${secLabel}</div>`;

                    // For the express lane (last section only, used when locked)
                    if (isLastSec) {
                        expressHtml += `<div style="margin-top:8px">`;
                    }

                    secLessons.forEach(lesson => {
                        // Accessible: within sequential unlocked sections OR in the last section (always open)
                        const accessible = isLastSec || (modUnlocked && lesson.section <= maxSec);
                        const isCurrent  = accessible && lesson.id === module.currentLesson && !lesson.completed;
                        const dotClass   = lesson.completed ? 'completed' : isCurrent ? 'in-progress' : '';
                        const dotSymbol  = lesson.completed ? '✓' : isCurrent ? '▶' : '';

                        // Unlock-key badge:
                        // • Last section: every lesson shows "🔑 unlock next module"
                        // • Other sections: only the last lesson shows "🔑 unlock next section"
                        const isKey    = isLastSec
                            ? true
                            : (sectionLastId[secNum] === lesson.id && secLessons.length > 1);
                        const keyText  = isLastSec ? '🔑 unlock next module' : '🔑 unlock next section';
                        const keyBadge = (isKey && accessible && !lesson.completed)
                            ? `<span class="lesson-key-badge">${keyText}</span>` : '';

                        const rightIcon = lesson.completed
                            ? '<div class="lesson-status-icon">✓</div>'
                            : (!accessible ? '<div style="font-size:13px;opacity:0.45">🔒</div>' : keyBadge);

                        const lessonItemHtml = `
                            <div class="lesson-item${accessible ? '' : ' lesson-locked'}"
                                 onclick="event.stopPropagation();enterLesson(${module.id},${lesson.id})">
                                <div class="lesson-number ${dotClass}">${dotSymbol}</div>
                                <div class="lesson-info">
                                    <div class="lesson-title">${lesson.title}</div>
                                    <div class="lesson-type">${lesson.type}</div>
                                </div>
                                ${rightIcon}
                            </div>`;

                        lessonsHtml += lessonItemHtml;
                        if (isLastSec) expressHtml += lessonItemHtml;
                    });

                    lessonsHtml += '</div>';
                    if (isLastSec) expressHtml += '</div>';
                });

                const card = document.createElement('div');
                card.className = `module-card ${!modUnlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}`;
                const illus = MODULE_ILLUSTRATIONS[module.id]
                    ? `<div class="module-illustration">${MODULE_ILLUSTRATIONS[module.id]}</div>` : '';
                card.innerHTML = `
                    ${illus}
                    <div class="module-header">
                        <div class="module-number">${module.number}</div>
                        ${!modUnlocked
                            ? `<div class="lock-icon">🔒</div>`
                            : `<div class="module-badge ${module.status === 'in-progress' ? 'in-progress' : isCompleted ? 'completed' : ''}">
                                ${isCompleted ? '✓ Completed' : module.status === 'in-progress' ? 'In Progress' : 'Not Started'}
                               </div>`}
                    </div>
                    <h3 class="module-title ${!modUnlocked ? 'module-locked-title' : ''}">${module.title}</h3>
                    <p class="module-description">${module.description}</p>
                    ${modUnlocked ? `
                        <div class="lesson-progress">
                            <div class="progress-label"><span>Progress</span><span>${module.completedLessons}/${module.totalLessons}</span></div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
                        </div>
                        <div class="lessons-list">${lessonsHtml}</div>
                        <button class="btn-primary" onclick="event.stopPropagation();enterLesson(${module.id},${module.currentLesson||1})">
                            ${isCompleted ? 'Review Module' : module.status === 'in-progress' ? 'Resume' : 'Start Module'}
                        </button>` : `
                        <div style="margin-top:14px;padding:12px;background:#E1F5EE;border:1.5px dashed #0F6E56;border-radius:10px">
                            <div style="font-size:10px;font-weight:700;color:#0F6E56;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px">🚀 Express Lane</div>
                            <p style="font-size:12px;color:#374151;margin:0 0 10px 0;line-height:1.4">Pass the reviews below to unlock the next module — no need to complete every lesson first.</p>
                            ${expressHtml}
                        </div>`}
                `;
                grid.appendChild(card);
            });
        }

        // ── LESSON SCREEN ──────────────────────────────────────────────
        function enterLesson(moduleId, lessonId) {
            if (!isLessonAccessible(moduleId, lessonId)) {
                showToast('🔒 Complete earlier lessons first');
                return;
            }
            currentModuleId  = moduleId;
            currentLessonId  = lessonId;
            currentStepIndex = 0;
            const mod = modulesData.find(m => m.id === moduleId);
            const les = mod && mod.lessons.find(l => l.id === lessonId);
            if (les && les.type === 'practice') {
                enterPracticeLesson(moduleId, lessonId);
                return;
            }
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('practiceScreen').classList.remove('active');
            document.getElementById('lessonScreen').classList.add('active');
            hideNav();
            window.scrollTo(0, 0);
            renderLesson();
        }

        function renderLesson() {
            const module = modulesData.find(m => m.id === currentModuleId);
            const lesson = module.lessons.find(l => l.id === currentLessonId);
            document.getElementById('lessonTitle').textContent = lesson.title;
            document.getElementById('lessonMeta').innerHTML =
                `<span class="task-type">${lesson.category}</span>`;

            let html = '';

            if (lesson.type === 'introduction') {
                html += renderIntroLesson(lesson);
            } else if (lesson.type === 'practice') {
                html += renderPracticeLesson(lesson);
            } else if (lesson.type === 'review') {
                html += renderReviewLesson(lesson);
            } else if (lesson.type === 'reading') {
                html += renderReadingLesson(lesson);
            }

            document.getElementById('lessonContent').innerHTML = html;
            document.getElementById('prevBtn').style.display = currentLessonId > 1 ? 'block' : 'none';
            updateContinueBtn();
        }

        function updateContinueBtn() {
            const module = modulesData.find(m => m.id === currentModuleId);
            const lesson = module && module.lessons.find(l => l.id === currentLessonId);
            const btn = document.getElementById('continueBtn');
            if (!btn || !lesson) return;

            const hasMoreSteps = lesson.content && lesson.content.steps &&
                                 currentStepIndex < lesson.content.steps.length - 1;
            const isLastLesson = currentLessonId >= module.totalLessons;

            if (hasMoreSteps) {
                btn.textContent = 'Next Step →';
            } else if (isLastLesson) {
                btn.textContent = 'Finish Module →';
            } else {
                btn.textContent = 'Continue →';
            }
        }

                        <div class="character-display">
                            <span class="character-large">${c.malayalam}</span>
                            <span class="character-iso">${c.iso15919}</span>
                        </div>
                        ${c.description ? `<p class="character-description">${c.description}</p>` : ''}
                        ${c.isNew ? '<span class="new-badge">NEW</span>' : ''}
                        <div class="char-card-sound-hint">🔊 tap to hear</div>
                    </div>`).join('')}
            </div>`;
        }

            return `

                    <p class="embedded-task-prompt">${task.prompt}</p>
                    <div class="embedded-task-options">

        function renderIntroLesson(lesson) {
            const c = lesson.content;
            let html = '';

            if (c.steps) {
                // Multi-step syllable intro
                const step = c.steps[currentStepIndex];
                html += `<div style="font-size:13px;color:#C8B89A;margin-bottom:12px">Step ${currentStepIndex + 1} of ${c.steps.length}: ${step.heading}</div>`;
                if (step.characters) html += renderCharCards(step.characters);
                if (step.embeddedTask) html += renderEmbeddedTask(step.embeddedTask);
                if (step.vowelSystemTable && step.matchingExercise) {
                    const pairs = step.matchingExercise;
                    const matchId = 'vowel-sys-' + Math.random().toString(36).slice(2,8);
                    const shuffledRight = shuffle([...pairs]);

                    // Table of vowel relationships
                    html += `<div style="margin-top:16px;margin-bottom:20px;overflow-x:auto">`;
                    html += `<table style="margin:0 auto;border-collapse:collapse;font-size:13px;width:100%;max-width:500px">`;
                    html += `<tr style="background:#E8D5A3;font-weight:600"><td style="padding:8px 12px;border:1px solid #E8D5A3">Vowel</td><td style="padding:8px 12px;border:1px solid #E8D5A3">Independent</td><td style="padding:8px 12px;border:1px solid #E8D5A3">On ക</td><td style="padding:8px 12px;border:1px solid #E8D5A3">Direction</td></tr>`;
                    const directions = ['(no sign)', 'right', 'left', 'left', 'wrap both', 'wrap both'];
                    pairs.forEach((p, i) => {
                        const bg = i % 2 === 0 ? '#f9fafb' : 'white';
                        html += `<tr style="background:${bg}"><td style="padding:8px 12px;border:1px solid #E8D5A3;font-weight:600">${p.desc}</td><td style="padding:8px 12px;border:1px solid #E8D5A3;font-size:18px">${p.left}</td><td style="padding:8px 12px;border:1px solid #E8D5A3;font-size:18px">${p.right}</td><td style="padding:8px 12px;border:1px solid #E8D5A3">${directions[i]}</td></tr>`;
                    });
                    html += `</table></div>`;

                    // Matching exercise
                    html += `<div style="margin-top:20px;padding:16px;background:#FDF6E3;border-radius:12px">`;
                    html += `<p style="font-size:13px;color:#7A6A55;margin-bottom:12px">Match each independent vowel to its form when written with a consonant:</p>`;

                    pairs.forEach((p, i) => {

                    shuffledRight.forEach((p, i) => {

                    shuffledRight.forEach((p, i) => {

        let matchState = { selected: null, matched: new Set(), type: null, pairs: [] };

        function renderMatchingGame(type, pairsSubset) {
            const pairs  = matchingPairs[type].filter(p => pairsSubset.includes(p.left) || pairsSubset.includes(p.right));
            const lefts  = shuffle([...pairs.map(p => p.left)]);
            const rights = shuffle([...pairs.map(p => p.right)]);
            // Unique ID per render — prevents multiple same-type games on one page
            // from sharing a pairs map and overwriting each other's state.
            const gameId = 'match-' + type + '-' + Math.random().toString(36).slice(2, 7);

            // Store pairs per game
            window._matchPairsMap = window._matchPairsMap || {};
            window._matchPairsMap[gameId] = pairs;

            const isSound = type === 'sound-letter';
            const leftLabel  = isSound ? 'Sound' : 'Letter';
            const rightLabel = isSound ? 'Letter' : 'Romanization';

            return `
                <div class="matching-game" id="${gameId}">
                    <div class="matching-columns">
                        <div class="matching-col">
                            <div class="matching-col-label">${leftLabel}</div>
                            ${lefts.map(val => `
                                <div class="match-card left-card ${isSound ? 'sound-card' : ''}"
                                     data-val="${val}" data-side="left"
                                     onclick="selectMatch(this, '${gameId}')">
                                    ${val}
                                </div>`).join('')}
                        </div>
                        <div class="matching-col">
                            <div class="matching-col-label">${rightLabel}</div>
                            ${rights.map(val => `
                                <div class="match-card right-card"
                                     data-val="${val}" data-side="right"
                                     onclick="selectMatch(this, '${gameId}')">
                                    ${val}
                                </div>`).join('')}
                        </div>
                    </div>
                    <div class="matching-feedback" id="${gameId}-feedback"></div>
                </div>`;
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function selectMatch(el, gameId) {
            if (el.classList.contains('matched') || el.classList.contains('disabled')) return;

            const side = el.dataset.side;
            const val  = el.dataset.val;
            const game = document.getElementById(gameId);

            if (!matchState[gameId]) matchState[gameId] = { leftSel: null, rightSel: null, matched: new Set() };
            const state = matchState[gameId];

            // Deselect same-side previous selection
            if (side === 'left' && state.leftSel) state.leftSel.classList.remove('selected');
            if (side === 'right' && state.rightSel) state.rightSel.classList.remove('selected');

            el.classList.add('selected');
            if (side === 'left')  state.leftSel  = el;
            else                  state.rightSel = el;

            // Both sides selected — check match
            if (state.leftSel && state.rightSel) {
                const lv = state.leftSel.dataset.val;
                const rv = state.rightSel.dataset.val;
                const pairs = (window._matchPairsMap || {})[gameId];
                const isMatch = pairs.some(p =>
                    (p.left === lv && p.right === rv) ||
                    (p.right === lv && p.left === rv)
                );

                if (isMatch) {
                    state.leftSel.classList.replace('selected', 'matched');
                    state.rightSel.classList.replace('selected', 'matched');
                    state.matched.add(lv);
                    state.matched.add(rv);
                    state.leftSel = null;
                    state.rightSel = null;

                    // Check if all matched
                    const allCards = game.querySelectorAll('.match-card');
                    if ([...allCards].every(c => c.classList.contains('matched'))) {
                        document.getElementById(gameId + '-feedback').innerHTML =
                            `<span style="color:#1A7A6E;font-weight:600">✓ All matched!</span>`;
                    }
                } else {
                    // Wrong — flash red then reset
                    state.leftSel.classList.add('wrong');
                    state.rightSel.classList.add('wrong');
                    const l = state.leftSel, r = state.rightSel;
                    state.leftSel = null; state.rightSel = null;
                    setTimeout(() => {
                        l.classList.remove('selected', 'wrong');
                        r.classList.remove('selected', 'wrong');
                    }, 600);
                }
            }
        }

        function renderPracticeLesson(lesson) {

            const scaffoldColor = { 'Guided': '#E1F5EE', 'Reduced guidance': '#fef9c3', 'Unguided': '#FFEBEE' };

            const allPairs       = ['അ','ആ','ക','മ','കാ','മാ'];

            const catName = lesson.categoryName || '';
            const subset  = catName.includes('Syllable') ? syllablePairs

            let html = `<div class="lesson-placeholder">

            html += `<p style="color:#C8B89A;font-size:13px;font-style:italic;margin-top:24px">Discrimination, identification and handwriting tasks coming soon</p></div>`;
            return html;
        }

        function speakMalayalam(text, rate) {
            if (!('speechSynthesis' in window)) return;
            // Stop any current speech without a timeout — calling cancel()
            // then speak() in the same tick works on all browsers as long as
            // we are directly inside a user gesture call stack (not a Promise).
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ml-IN';
            u.rate = rate || 0.8;
            u.onerror = () => {}; // silence console noise on unsupported voices
            speechSynthesis.speak(u);
        }

        function playText(text, btn) {
            if (btn) { const o = btn.style.background; btn.style.background = '#FFF0D9'; setTimeout(() => btn.style.background = o, 400); }
            speakMalayalam(text, 0.75);
        }

        function nextStep() {
            const module = modulesData.find(m => m.id === currentModuleId);
            const lesson = module.lessons.find(l => l.id === currentLessonId);
            if (currentStepIndex < lesson.content.steps.length - 1) {
                currentStepIndex++;

                renderLesson();

        function checkEmbedded(chosen, correct) {
            const feedback = document.getElementById('embFeedback');
            const buttons  = document.querySelectorAll('.task-option');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                btn.style.background = i === correct ? '#E1F5EE' : (i === chosen && chosen !== correct ? '#FFEBEE' : '');
                btn.style.borderColor = i === correct ? '#1A7A6E' : (i === chosen && chosen !== correct ? '#C0392B' : '');
            });
            feedback.textContent = chosen === correct ? '✓ Correct!' : '✗ Not quite. The highlighted answer is correct.';
            feedback.style.color = chosen === correct ? '#1A7A6E' : '#C0392B';
            feedback.style.marginTop = '12px';
            feedback.style.fontWeight = '600';
        }

        function nextLesson() {
            const module = modulesData.find(m => m.id === currentModuleId);
            const lesson = module.lessons.find(l => l.id === currentLessonId);

            if (lesson.content.steps && currentStepIndex < lesson.content.steps.length - 1) {
                nextStep();
                return;
            }

            // Past last step — lesson is complete
            markLessonComplete(currentModuleId, currentLessonId);

            if (currentLessonId < module.totalLessons) {
                const nextId  = currentLessonId + 1;
                const nextLes = module.lessons.find(l => l.id === nextId);
                if (nextLes && nextLes.type === 'practice') {
                    enterPracticeLesson(currentModuleId, nextId);
                    return;
                }
                currentLessonId = nextId;
                currentStepIndex = 0;
                window.scrollTo(0, 0);
                renderLesson();
            } else {
                goHome();
            }
        }

        function previousLesson() {
            if (currentLessonId > 1) {
                currentLessonId--;
                currentStepIndex = 0;
                window.scrollTo(0, 0);
                renderLesson();
            }
        }

            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('[data-tab="' + tabName + '"]').forEach(t => t.classList.add('active'));
            window.scrollTo(0, 0);
            if (tabName === 'revise')    renderReviseCheckboxes();
            if (tabName === 'settings')  { switchSettingsTab('audio'); }
            if (tabName === 'reference') renderReferenceTab();
            if (tabName === 'progress')  updateProgressCards();
        }

        // ── PRACTICE ENGINE ──────────────────────────────────────

        const charPool = {
            vowels:     [ { malayalam:"അ", iso15919:"a"  }, { malayalam:"ആ", iso15919:"ā"  } ],
            consonants: [ { malayalam:"ക", iso15919:"ka" }, { malayalam:"മ", iso15919:"ma" } ],
            syllables:  [ { malayalam:"ക", iso15919:"ka" }, { malayalam:"കാ", iso15919:"kā" },
                          { malayalam:"മ", iso15919:"ma" }, { malayalam:"മാ", iso15919:"mā" } ]
        };

        function charsForLesson(lesson) {
            // Module 2+ lessons carry chars directly in content
            if (lesson.content && lesson.content.chars) return lesson.content.chars;
            // Module 1 fallback: infer from categoryName
            const n = lesson.categoryName || '';
            if (n.includes('Syllable'))  return charPool.syllables;
            if (n.includes('Consonant')) return charPool.consonants;
            return charPool.vowels;
        }

        function getKeyboard(chars) {
            const keys = [], seen = new Set();
            chars.forEach(c => [...c.iso15919].forEach(ch => { if (!seen.has(ch)) { seen.add(ch); keys.push(ch); } }));
            return keys;
        }

        // Confusable pairs by PHONETICS (sound-based)
        // This map documents phonetic pairs that learners commonly confuse in Malayalam
        // As new modules are built, add new confusable pairs here with their module reference
        function getConfusablePairs(chars) {
            const pairs = [];
            const phoneticsConfusionMap = {
                // VOWELS: Long vs Short
                'അ': 'ആ', 'ആ': 'അ',  // a vs ā
                'ഇ': 'ഈ', 'ഈ': 'ഇ',  // i vs ī
                'ഉ': 'ഊ', 'ഊ': 'ഉ',  // u vs ū
                'എ': 'ഏ', 'ഏ': 'എ',  // e vs ē
                'ഒ': 'ഓ', 'ഓ': 'ഒ',  // o vs ō

                // CONSONANTS: Manner of articulation
                'റ': 'ര', 'ര': 'റ',  // trill vs tap (both alveolar)

                // CONSONANTS: Sibilants/Fricatives
                'ശ': 'ഷ', 'ഷ': 'ശ',  // alveolar vs retroflex sh
                'ള': 'ഴ', 'ഴ': 'ള',  // retroflex l vs retroflex voiced fricative

                // CONSONANTS: Nasals
                'ഞ': 'ങ', 'ങ': 'ഞ',  // palatal vs velar nasal

                // CONSONANTS: Unaspirated vs Aspirated stops
                'ബ': 'ഭ', 'ഭ': 'ബ',  // b vs bh (bilabial)
                'ഫ': 'പ', 'പ': 'ഫ',  // fricative f vs stop p
                'ദ': 'ധ', 'ധ': 'ദ',  // d vs dh (dental)
                'ട': 'ഠ', 'ഠ': 'ട',  // retroflex t vs th
                'ഡ': 'ഢ', 'ഢ': 'ഡ',  // retroflex d vs dh

                // CONSONANTS: Affricates & related
                'ജ': 'ച', 'ച': 'ജ',  // alveolar vs palatal affricate
                'ച': 'ഛ', 'ഛ': 'ച',  // palatal affricate vs aspirated
                'ജ': 'ഝ', 'ഝ': 'ജ',  // alveolar affricate vs alveolar fricative

                // CONSONANTS: Velar stops
                'ഗ': 'ഘ', 'ഘ': 'ഗ',  // g vs gh (velar)

                // CONSONANTS: Liquids/Approximants
                'ല': 'ള', 'ള': 'ല'   // alveolar l vs retroflex l
            };

            // Confusable pairs by APPEARANCE (visually similar)
            const appearanceConfusionMap = {
                // Consonants that look visually similar
                'പ': 'ഫ', 'ഫ': 'പ',    // pa vs pha (similar shapes)
                'ദ': 'ഭ', 'ഭ': 'ദ',    // da vs bha (similar shapes)
                'ഖ': 'വ', 'വ': 'ഖ',    // kha vs va (similar shapes)
                'ഡ': 'സ', 'സ': 'ഡ',    // retroflex da vs sa (similar shapes)
                'ങ': 'ഞ', 'ഞ': 'ങ',    // nga vs nja (similar shapes)
                'ങ': 'ണ', 'ണ': 'ങ',    // nga vs retroflex na (similar shapes)
                'ഞ': 'ണ', 'ണ': 'ഞ',    // nja vs retroflex na (similar shapes)
                'യ': 'ത', 'ത': 'യ'     // ya vs ta (similar shapes)
            };

            // Combine both maps for full confusable pair detection
            const confusionMap = { ...phoneticsConfusionMap, ...appearanceConfusionMap };

            const charMap = {};
            chars.forEach(c => { charMap[c.malayalam] = c; });

            // Check for vowel pair confusions
            ['അ', 'ആ', 'എ', 'ഏ', 'ഒ', 'ഓ'].forEach(v => {
                const v2 = confusionMap[v];
                if (charMap[v] && charMap[v2]) {
                    const pair = [charMap[v], charMap[v2]];
                    pairs.push(pair);
                }
            });

            // Check for consonant pair confusions
            ['ട', 'ത', 'ണ', 'ന', 'ള', 'ല'].forEach(c => {
                const c2 = confusionMap[c];
                if (charMap[c] && charMap[c2]) {
                    const pair = [charMap[c], charMap[c2]];
                    pairs.push(pair);
                }
            });

            // Also check for syllable forms with confusable bases
            // e.g., കാ vs കെ, പൊ vs പോ, തെ vs തേ, നു vs നൂ
            chars.forEach(c => {
                const mal = c.malayalam;
                const iso = c.iso15919;

                // Check if this is a syllable (consonant + vowel sign)
                if (mal.length > 1) {
                    // Extract base consonant and vowel sign
                    const baseChar = mal[0];
                    const vowelSign = mal.substring(1);

                    // Find confusable base
                    const confusableBase = confusionMap[baseChar];
                    if (confusableBase) {
                        // Look for syllables with confusable base and same vowel sign
                        chars.forEach(c2 => {
                            if (c2.malayalam[0] === confusableBase && c2.malayalam.substring(1) === vowelSign) {
                                pairs.push([c, c2]);
                            }
                        });
                    }

                    // Also check for vowel confusion: same consonant, different vowel length
                    const vowelConfusable = confusionMap[baseChar];
                    if (vowelConfusable) {
                        // Look for confusable vowel sign
                        const possibleVowelSigns = {
                            'ാ': 'െ', 'െ': 'ാ', 'ാ': 'ാ',
                            'േ': 'െ', 'െ': 'േ',
                            'ോ': 'ൊ', 'ൊ': 'ോ',
                            'ൂ': 'ു', 'ു': 'ൂ'
                        };
                        const confusableVowel = possibleVowelSigns[vowelSign];
                        if (confusableVowel) {
                            chars.forEach(c2 => {
                                if (c2.malayalam[0] === baseChar && c2.malayalam.substring(1) === confusableVowel) {
                                    pairs.push([c, c2]);
                                }
                            });
                        }
                    }
                }
            });

            // Remove duplicates
            const seen = new Set();
            const uniquePairs = [];
            pairs.forEach(pair => {
                const key = [pair[0].malayalam, pair[1].malayalam].sort().join('|');
                if (!seen.has(key)) {
                    seen.add(key);
                    uniquePairs.push(pair);
                }
            });

            return uniquePairs;
        }

        // Select characters for matching with at least one confusable pair included
        function getMatchingCharsWithConfusables(allChars, maxPairs = 5) {
            const confusablePairs = getConfusablePairs(allChars);

            if (confusablePairs.length === 0) {
                // No confusables available, just return random selection
                return shuffle([...allChars]).slice(0, Math.min(maxPairs, allChars.length));
            }

            // Include at least one confusable pair
            const selectedPair = confusablePairs[Math.floor(Math.random() * confusablePairs.length)];
            const chars = [selectedPair[0], selectedPair[1]];

            // Fill remaining slots with random characters
            const remaining = maxPairs - chars.length;
            if (remaining > 0) {
                const available = allChars.filter(c => !chars.find(ch => ch.iso15919 === c.iso15919));
                const additional = shuffle([...available]).slice(0, remaining);
                chars.push(...additional);
            }

            return shuffle(chars);
        }

        // Generate confusable romanization options for hearing-to-romanization tasks
        // Uses both phonetic and appearance-based confusables to ensure comprehensive coverage
        function getConfusableOptions(targetChar, allChars) {
            const options = [targetChar]; // Always include correct answer

            const phoneticsConfusionMap = {
                // VOWELS: Long vs Short
                'അ': 'ആ', 'ആ': 'അ',  // a vs ā
                'ഇ': 'ഈ', 'ഈ': 'ഇ',  // i vs ī
                'ഉ': 'ഊ', 'ഊ': 'ഉ',  // u vs ū
                'എ': 'ഏ', 'ഏ': 'എ',  // e vs ē
                'ഒ': 'ഓ', 'ഓ': 'ഒ',  // o vs ō

                // CONSONANTS: Manner of articulation
                'റ': 'ര', 'ര': 'റ',  // trill vs tap (both alveolar)

                // CONSONANTS: Sibilants/Fricatives
                'ശ': 'ഷ', 'ഷ': 'ശ',  // alveolar vs retroflex sh
                'ള': 'ഴ', 'ഴ': 'ള',  // retroflex l vs retroflex voiced fricative

                // CONSONANTS: Nasals
                'ഞ': 'ങ', 'ങ': 'ഞ',  // palatal vs velar nasal

                // CONSONANTS: Unaspirated vs Aspirated
                'ബ': 'ഭ', 'ഭ': 'ബ',  // b vs bh
                'ഫ': 'പ', 'പ': 'ഫ',  // fricative f vs stop p
                'ദ': 'ധ', 'ധ': 'ദ',  // d vs dh
                'ട': 'ഠ', 'ഠ': 'ട',  // retroflex t vs th
                'ഡ': 'ഢ', 'ഢ': 'ഡ',  // retroflex d vs dh

                // CONSONANTS: Affricates & related
                'ജ': 'ച', 'ച': 'ജ',  // alveolar vs palatal affricate
                'ച': 'ഛ', 'ഛ': 'ച',  // palatal affricate vs aspirated
                'ജ': 'ഝ', 'ഝ': 'ജ',  // alveolar affricate vs alveolar fricative

                // CONSONANTS: Velar stops
                'ഗ': 'ഘ', 'ഘ': 'ഗ',  // g vs gh

                // CONSONANTS: Liquids/Approximants
                'ല': 'ള', 'ള': 'ല'   // alveolar l vs retroflex l
            };

            const appearanceConfusionMap = {
                // Visually similar consonants
                'പ': 'ഫ', 'ഫ': 'പ',
                'ദ': 'ഭ', 'ഭ': 'ദ',
                'ഖ': 'വ', 'വ': 'ഖ',
                'ഡ': 'സ', 'സ': 'ഡ',
                'ങ': 'ഞ', 'ഞ': 'ങ',
                'ങ': 'ണ', 'ണ': 'ങ',
                'ഞ': 'ണ', 'ണ': 'ഞ',
                'യ': 'ത', 'ത': 'യ'
            };

            const confusionMap = { ...phoneticsConfusionMap, ...appearanceConfusionMap };

            const targetMal = targetChar.malayalam;
            const targetIso = targetChar.iso15919;

            // Extract base consonant and vowel (if any)
            const baseChar = targetMal[0];
            const vowelPart = targetMal.length > 1 ? targetMal.substring(1) : '';

            // 1. Add confusable consonant pair (e.g., ṇ ↔ n)
            const confusableBase = confusionMap[baseChar];
            if (confusableBase) {
                const confusableChar = confusableBase + vowelPart;
                const match = allChars.find(c => c.malayalam === confusableChar);
                if (match && !options.find(o => o.iso15919 === match.iso15919)) {
                    options.push(match);
                }
            }

            // 2. Add confusable vowel variant (e.g., a ↔ ā, e ↔ ē)
            const vowelConfusionMap = { 'ാ': 'ാ', 'െ': 'േ', 'ൊ': 'ോ', 'ു': 'ൂ', 'ി': 'ീ' };
            const confusableVowel = vowelConfusionMap[vowelPart];
            if (confusableVowel && confusableVowel !== vowelPart) {
                const vowelVariant = baseChar + confusableVowel;
                const match = allChars.find(c => c.malayalam === vowelVariant);
                if (match && !options.find(o => o.iso15919 === match.iso15919)) {
                    options.push(match);
                }
            }

            // 3. Add same consonant with different vowels
            for (const char of allChars) {
                if (char.malayalam[0] === baseChar && !options.find(o => o.iso15919 === char.iso15919)) {
                    options.push(char);
                    if (options.length >= 6) break;
                }
            }

            // 4. Fill remaining with random options if needed
            const remaining = 6 - options.length;
            if (remaining > 0) {
                const candidates = shuffle(allChars.filter(c => !options.find(o => o.iso15919 === c.iso15919)));
                options.push(...candidates.slice(0, remaining));
            }

            return shuffle(options.slice(0, 6));
        }

        function generateTasks(lesson) {
            const chars    = charsForLesson(lesson);
            const scaffold = (lesson.content && lesson.content.scaffold) || 'Guided';
            const skipDiscrimination = (lesson.content && lesson.content.skipDiscrimination) || false;
            const chandrakkalaReview = (lesson.content && lesson.content.chandrakkalaReview) || false;
            const last     = chars[chars.length - 1];
            const kb       = getKeyboard(chars);
            const tasks    = [];
            const limitedChars = chars.length > 8 ? shuffle([...chars]).slice(0, 8) : [...chars];

            if (scaffold === 'Guided') {
                if (!skipDiscrimination) {
                    tasks.push({ type:'discrimination', c1:chars[0], c2:chars[0], answer:'same' });
                    tasks.push({ type:'discrimination', c1:last,     c2:last,     answer:'same' });
                    tasks.push({ type:'discrimination', c1:chars[0], c2:last,     answer:'different' });
                }
                chars.forEach(ch => {
                    let opts = shuffle([...limitedChars]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'guided', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });
                if (chars.length === 2) {
                    let opts = shuffle([...limitedChars]).filter(o => o.malayalam !== chars[1].malayalam).slice(0, 5);
                    opts.push(chars[1]);
                    tasks.push({ type:'identification', variant:'guided', char:chars[1], options:shuffle(opts), correct:chars[1].malayalam });
                }
                tasks.push({ type:'matching', variant:'guided', chars:getMatchingCharsWithConfusables(chars, Math.min(5, chars.length)) });
                const hw = chars.length >= 3 ? shuffle([...chars]).slice(0,3) : [chars[0], last, chars[0]];
                hw.forEach(ch => tasks.push({ type:'handwriting', variant:'full', char:ch }));

            } else if (scaffold === 'Reduced guidance') {
                if (!skipDiscrimination) {
                    tasks.push({ type:'discrimination', c1:chars[0], c2:last, answer:'different' });
                    tasks.push({ type:'discrimination', c1:chars[0], c2:chars[0], answer:'same' });
                }
                shuffle([...chars]).slice(0,2).forEach(ch => {
                    const opts = getConfusableOptions(ch, chars);
                    tasks.push({ type:'identification', variant:'reducedA', char:ch, options:opts, correct:ch.iso15919 });
                });
                shuffle([...chars]).slice(0,2).forEach(ch => {
                    let opts = shuffle([...limitedChars]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'reducedB', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });
                tasks.push({ type:'matching', variant:'reducedA', chars:getMatchingCharsWithConfusables(chars, Math.min(5, chars.length)) });
                tasks.push({ type:'matching', variant:'reducedB', chars:getMatchingCharsWithConfusables(chars, Math.min(5, chars.length)) });
                shuffle([...chars]).slice(0,2).forEach(ch =>
                    tasks.push({ type:'transliteration', char:ch, keyboard:kb }));
                // 4 HW tasks: both sides for each char (2 chars) or 2 random chars (4-char set)
                const hwChars = chars.length >= 3 ? shuffle([...chars]).slice(0,2) : [...chars];
                hwChars.forEach(ch => {
                    tasks.push({ type:'handwriting', variant:'half', char:ch, side:'left'  });
                    tasks.push({ type:'handwriting', variant:'half', char:ch, side:'right' });
                });

            } else if (scaffold === 'Cumulative') {
                // Large cross-module pool — sample 8 focus chars per session
                const pool   = shuffle([...chars]);
                const focus  = pool.slice(0, Math.min(8, pool.length));
                const first4 = focus.slice(0, Math.min(4, focus.length));
                const next4  = focus.length >= 8 ? focus.slice(4, 8) : [...first4];
                const kbCum  = getKeyboard(focus);

                // Identification: sound → letter (hear, pick Malayalam)
                first4.forEach(ch => {
                    let opts = shuffle([...focus]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'unguided', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });
                // Identification: roman → letter (see ISO, pick Malayalam)
                next4.forEach(ch => {
                    let opts = shuffle([...focus]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'guided', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });
                // Matching: romanization → letter
                tasks.push({ type:'matching', variant:'reducedB', chars:getMatchingCharsWithConfusables(first4, Math.min(5, first4.length)) });
                // Matching: sound → letter
                tasks.push({ type:'matching', variant:'unguided', chars:getMatchingCharsWithConfusables(next4, Math.min(5, next4.length)) });
                // Transliteration (2 tasks)
                shuffle([...focus]).slice(0,2).forEach(ch =>
                    tasks.push({ type:'transliteration', char:ch, keyboard:kbCum }));
                // Handwriting (3 tasks)
                shuffle([...focus]).slice(0,3).forEach(ch =>
                    tasks.push({ type:'handwriting', variant:'none', char:ch }));

            } else if (scaffold === 'Review') {
                // --- REVIEW scaffold ---
                // Confusable-pair discrimination (up to 2 pairs)
                const confPairs = getConfusablePairs(chars);
                if (confPairs.length > 0) {
                    shuffle(confPairs).slice(0, Math.min(2, confPairs.length)).forEach(pair =>
                        tasks.push({ type:'discrimination', c1:pair[0], c2:pair[1], answer:'different' }));
                } else if (chars.length >= 2) {
                    tasks.push({ type:'discrimination', c1:chars[0], c2:last, answer:'different' });
                }
                // Identification: 2 tasks, unguided, 6 cards each
                shuffle([...chars]).slice(0, 2).forEach(ch => {
                    let opts = shuffle([...limitedChars]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'unguided', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });
                // Two matching sets (roman→letter, sound→letter)
                tasks.push({ type:'matching', variant:'reducedB', chars: getMatchingCharsWithConfusables(chars, Math.min(5, chars.length)) });
                tasks.push({ type:'matching', variant:'unguided',  chars: getMatchingCharsWithConfusables(chars, Math.min(5, chars.length)) });
                // Transliteration: 1 per character
                chars.forEach(ch =>
                    tasks.push({ type:'transliteration', char:ch, keyboard:kb }));
                // Handwriting: 3 random chars, unguided (no guide)
                shuffle([...chars]).slice(0, Math.min(3, chars.length)).forEach(ch =>
                    tasks.push({ type:'handwriting', variant:'none', char:ch }));
                // Optional overview card prepended (not shuffled with tasks)
                const overview = (lesson.content && lesson.content.introCards)
                    ? [{ type:'overview', chars: lesson.content.introCards }]
                    : [];
                return [...overview, ...shuffle(tasks)];

            } else { // Unguided
                if (!skipDiscrimination) {
                    tasks.push({ type:'discrimination', c1:chars[0], c2:last, answer:'different' });
                }
                // For chandrakkala review: limit identification to 4 tasks; otherwise use all chars
                const identificationChars = chandrakkalaReview ? shuffle([...chars]).slice(0, 4) : chars;
                identificationChars.forEach(ch => {
                    let opts = shuffle([...limitedChars]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'unguided', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });
                // For chandrakkala review: add 2 matching tasks with 6 options each (different directions); otherwise add 1
                if (chandrakkalaReview) {
                    tasks.push({ type:'matching', variant:'reducedB', chars:getMatchingCharsWithConfusables(chars, 6) });  // Roman to letter
                    tasks.push({ type:'matching', variant:'unguided', chars:getMatchingCharsWithConfusables(chars, 6) });  // Sound to letter
                } else {
                    tasks.push({ type:'matching', variant:'unguided', chars:getMatchingCharsWithConfusables(chars, chars.length) });
                }
                // For chandrakkala review: 3 transliteration tasks; otherwise 2
                const translitCount = chandrakkalaReview ? 3 : 2;
                shuffle([...chars]).slice(0, translitCount).forEach(ch =>
                    tasks.push({ type:'transliteration', char:ch, keyboard:kb }));
                // For chandrakkala review: only include chandrakkala forms (single consonant iso15919: k, t, ṭ, n, m, p, v, ṇ), max 3 tasks
                // For skipDiscrimination lessons (e.g., chillus with 4 chars), include all; otherwise use up to 3
                let hw2;
                if (chandrakkalaReview) {
                    // Filter to only chandrakkala forms and limit to 3 for review
                    const chandrakkalaChars = chars.filter(ch => /^[ktṭnmpvṇ]$/.test(ch.iso15919));
                    hw2 = chandrakkalaChars.length > 0 ? shuffle(chandrakkalaChars).slice(0, 3) : [...chars].slice(0, 3);
                } else {
                    hw2 = (skipDiscrimination && chars.length === 4) ? [...chars] :
                          (chars.length >= 3 ? shuffle([...chars]).slice(0,3) : [chars[0], last, chars[0]]);
                }
                hw2.forEach(ch => tasks.push({ type:'handwriting', variant:'none', char:ch }));
            }

            return shuffle(tasks);
        }

        let ps = {};
        let hwCtx = null, hwDrawing = false, hwHasStrokes = false;

        function enterPracticeLesson(moduleId, lessonId) {
            if (!isLessonAccessible(moduleId, lessonId)) {
                showToast('🔒 Complete earlier lessons first');
                return;
            }
            currentModuleId = moduleId;
            currentLessonId = lessonId;
            const mod = modulesData.find(m => m.id === moduleId);
            const les = mod.lessons.find(l => l.id === lessonId);
            ps = { tasks: generateTasks(les), currentIndex: 0, wrongQueue: [],
                   correctCount: 0, totalAnswered: 0, title: les.title,
                   pmSel: null, pmMatched: new Set(), pmPairs: [], pmVariant: null,
                   translitBuffer: '' };
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('lessonScreen').classList.remove('active');
            document.getElementById('practiceScreen').classList.add('active');
            hideNav();
            window.scrollTo(0, 0);
            document.getElementById('practiceFeedback').className = 'feedback-bar fb-hidden';
            renderPracticeTask();
        }

        let currentReviewDifficulty = 'Reduced guidance';

        function selectReviewDifficulty(difficulty, element) {
            currentReviewDifficulty = difficulty;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function renderReviseCheckboxes() {
            const container = document.getElementById('moduleCheckboxes');
            if (!container) return;
            const prev = {}; // preserve checked state across re-renders
            container.querySelectorAll('.module-checkbox').forEach(cb => {
                prev[cb.id] = cb.checked;
            });
            container.innerHTML = '';
            modulesData.forEach(mod => {
                if (!isModuleUnlocked(mod.id)) return;
                const id = 'reviewM' + mod.id;
                const checked = (id in prev) ? prev[id] : true; // default checked
                const wrap = document.createElement('div');
                wrap.className = 'module-checkbox-wrapper';
                wrap.innerHTML = `
                    <input type="checkbox" id="${id}" class="module-checkbox" ${checked ? 'checked' : ''}>
                    <label for="${id}" class="module-checkbox-label">Module ${mod.id}</label>`;
                container.appendChild(wrap);
            });
            if (!container.children.length) {
                container.innerHTML = '<p style="font-size:13px;color:#C8B89A;margin:8px 0">Complete Module 1 to unlock Random Review.</p>';
            }
            syncSelectAllBtn();
        }

        function syncSelectAllBtn() {
            const btn = document.getElementById('selectAllBtn');
            if (!btn) return;
            const checkboxes = document.querySelectorAll('.module-checkbox');
            const anyChecked = [...checkboxes].some(cb => cb.checked);
            btn.textContent = anyChecked ? 'Deselect All' : 'Select All';
        }

        function toggleSelectAllModules(btn) {
            const checkboxes = document.querySelectorAll('.module-checkbox');
            const anyChecked = [...checkboxes].some(cb => cb.checked);
            checkboxes.forEach(cb => { cb.checked = !anyChecked; });
            btn.textContent = anyChecked ? 'Select All' : 'Deselect All';
        }

        function startRandomReview() {
            const selectedModules = [];
            document.querySelectorAll('.module-checkbox').forEach(cb => {
                if (cb.checked) {
                    const id = parseInt(cb.id.replace('reviewM', ''));
                    if (!isNaN(id)) selectedModules.push(id);
                }
            });

            if (selectedModules.length === 0) {
                alert('Please select at least one module to review.');
                return;
            }

            enterRandomReview(selectedModules, currentReviewDifficulty);
        }

        function enterRandomReview(selectedModules, difficulty) {
            // Collect all characters from selected modules
            const allChars = [];
            const seenChars = new Set();

            selectedModules.forEach(moduleId => {
                const mod = modulesData.find(m => m.id === moduleId);
                if (!mod) return;

                mod.lessons.forEach(lesson => {
                    const chars = charsForLesson(lesson);
                    chars.forEach(char => {
                        const charKey = char.malayalam;
                        if (!seenChars.has(charKey)) {
                            seenChars.add(charKey);
                            allChars.push(char);
                        }
                    });
                });
            });

            if (allChars.length === 0) {
                alert('No characters found in selected modules.');
                return;
            }

            // Generate tasks with smart discrimination (only confusable pairs)
            const tasks = [];
            const kb = getKeyboard(allChars);
            const confusablePairs = getConfusablePairs(allChars);

            if (difficulty === 'Reduced guidance') {
                // Add discrimination tasks with confusable pairs (max 2)
                if (confusablePairs.length > 0) {
                    shuffle(confusablePairs).slice(0, Math.min(2, confusablePairs.length)).forEach(pair => {
                        tasks.push({ type:'discrimination', c1:pair[0], c2:pair[1], answer:'different' });
                    });
                }
                // Add same-pair discrimination
                tasks.push({ type:'discrimination', c1:allChars[0], c2:allChars[0], answer:'same' });

                // Identification tasks with limited options (max 8) - using confusable options
                shuffle([...allChars]).slice(0,2).forEach(ch => {
                    const opts = getConfusableOptions(ch, allChars);
                    tasks.push({ type:'identification', variant:'reducedA', char:ch, options:opts, correct:ch.iso15919 });
                });
                shuffle([...allChars]).slice(0,2).forEach(ch => {
                    let opts = shuffle([...allChars]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'reducedB', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });

                // Matching tasks with limited pairs (max 5) - ensure confusables included
                tasks.push({ type:'matching', variant:'reducedA', chars:getMatchingCharsWithConfusables(allChars, 5) });
                tasks.push({ type:'matching', variant:'reducedB', chars:getMatchingCharsWithConfusables(allChars, 5) });

                // Transliteration
                shuffle([...allChars]).slice(0,2).forEach(ch =>
                    tasks.push({ type:'transliteration', char:ch, keyboard:kb }));

                // Handwriting
                const hwChars = allChars.length >= 3 ? shuffle([...allChars]).slice(0,2) : [...allChars];
                hwChars.forEach(ch => {
                    tasks.push({ type:'handwriting', variant:'half', char:ch, side:'left'  });
                    tasks.push({ type:'handwriting', variant:'half', char:ch, side:'right' });
                });

            } else { // Unguided
                // Add discrimination tasks with confusable pairs (max 2)
                if (confusablePairs.length > 0) {
                    shuffle(confusablePairs).slice(0, Math.min(2, confusablePairs.length)).forEach(pair => {
                        tasks.push({ type:'discrimination', c1:pair[0], c2:pair[1], answer:'different' });
                    });
                }
                // Add same-pair discrimination
                tasks.push({ type:'discrimination', c1:allChars[0], c2:allChars[0], answer:'same' });

                // Identification tasks with limited options (max 8)
                shuffle([...allChars]).slice(0, Math.min(8, allChars.length)).forEach(ch => {
                    let opts = shuffle([...allChars]).filter(o => o.malayalam !== ch.malayalam).slice(0, 5);
                    opts.push(ch);
                    tasks.push({ type:'identification', variant:'unguided', char:ch, options:shuffle(opts), correct:ch.malayalam });
                });

                // Matching task with limited pairs (max 5) - ensure confusables included
                tasks.push({ type:'matching', variant:'unguided', chars:getMatchingCharsWithConfusables(allChars, 5) });

                // Transliteration
                shuffle([...allChars]).slice(0,2).forEach(ch =>
                    tasks.push({ type:'transliteration', char:ch, keyboard:kb }));

                // Handwriting
                const hw2 = allChars.length >= 3 ? shuffle([...allChars]).slice(0,3) : [allChars[0], allChars[allChars.length-1], allChars[0]];
                hw2.forEach(ch => tasks.push({ type:'handwriting', variant:'none', char:ch }));
            }

            // Initialize practice session
            ps = {
                tasks: shuffle(tasks),
                currentIndex: 0,
                wrongQueue: [],
                correctCount: 0,
                totalAnswered: 0,
                title: 'Random Review',
                pmSel: null,
                pmMatched: new Set(),
                pmPairs: [],
                pmVariant: null,
                translitBuffer: '',
                isRandomReview: true
            };

            // Switch to practice screen
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('lessonScreen').classList.remove('active');
            document.getElementById('practiceScreen').classList.add('active');
            hideNav();
            document.getElementById('practiceFeedback').className = 'feedback-bar fb-hidden';
            renderPracticeTask();
        }

        function buildOverview(task) {
            return `<div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0">
                <p class="task-prompt" style="margin-bottom:0">Review these characters before we begin</p>
                ${renderCharCards(task.chars)}
                <button class="btn-primary" style="width:100%;max-width:280px;margin-top:8px" onclick="skipTask()">Let's practice →</button>
            </div>`;
        }

        function renderPracticeTask() {
            if (ps.currentIndex >= ps.tasks.length) { finishPractice(); return; }
            const total = ps.tasks.length;
            const done  = ps.currentIndex;
            document.getElementById('practiceProgressFill').style.width = (done/total*100)+'%';
            document.getElementById('practiceProgressLabel').textContent = done+'/'+total;
            const task = ps.tasks[ps.currentIndex];
            const area = document.getElementById('practiceTaskArea');
            if (task.type === 'overview') {
                document.getElementById('taskSkipRow').style.display = 'none';
                area.innerHTML = buildOverview(task);
            } else {
                document.getElementById('taskSkipRow').style.display = '';
                document.getElementById('taskPrevBtn').style.display = ps.currentIndex > 0 ? '' : 'none';
                if      (task.type === 'discrimination')  area.innerHTML = buildDiscrimination(task);
                else if (task.type === 'identification')  area.innerHTML = buildIdentification(task);
                else if (task.type === 'matching')        { area.innerHTML = buildMatching(task);        initPM(task); }
                else if (task.type === 'handwriting')     { area.innerHTML = buildHandwriting(task);     initCanvas(); }
                else if (task.type === 'transliteration') { area.innerHTML = buildTransliteration(task); ps.translitBuffer = ''; }
            }
        }

        function buildDiscrimination(t) {
            return `<p class="task-prompt">Are these the same or different?</p>
            <div class="discrimination-sounds">
                <button class="sound-play-btn" onclick="playAudio('${t.c1.iso15919}',this)">
                    <span class="snd-icon">🔊</span><span>Sound 1 · tap to hear</span>
                </button>
                <button class="sound-play-btn" onclick="playAudio('${t.c2.iso15919}',this)">
                    <span class="snd-icon">🔊</span><span>Sound 2 · tap to hear</span>
                </button>
            </div>
            <div class="discrimination-choices">
                <button class="discrimination-btn" onclick="answerDisc('same','${t.answer}',this)">Same</button>
                <button class="discrimination-btn" onclick="answerDisc('different','${t.answer}',this)">Different</button>
            </div>`;
        }

        function buildIdentification(t) {
            const optsMal = t.options.map(o =>
                `<button class="id-option" data-val="${o.malayalam}"
                    onclick="answerIdent('${o.malayalam}','${t.correct}',this)">${o.malayalam}</button>`).join('');
            const optsRom = t.options.map(o =>
                `<button class="id-option id-roman-opt" data-val="${o.iso15919}"
                    onclick="answerIdent('${o.iso15919}','${t.correct}',this)">${o.iso15919}</button>`).join('');
            switch (t.variant) {
                case 'guided':
                    return `<p class="task-prompt">How do you spell this in Malayalam?</p>
                    <div class="identification-prompt-card">
                        <span class="id-roman">${t.char.iso15919}</span>
                        <button class="id-sound-btn" onclick="playAudio('${t.char.iso15919}',this)">🔊</button>
                    </div>
                    <div class="identification-options">${optsMal}</div>`;
                case 'reducedA':
                    return `<p class="task-prompt">What is the romanization of this sound?</p>
                    <div style="text-align:center;margin-bottom:28px">
                        <button class="id-big-sound" onclick="playAudio('${t.char.iso15919}',this)">🔊</button>
                    </div>
                    <div class="identification-options">${optsRom}</div>`;
                case 'reducedB':
                    return `<p class="task-prompt">How do you spell this in Malayalam?</p>
                    <div class="id-prompt-no-sound">
                        <span class="id-roman">${t.char.iso15919}</span>
                    </div>
                    <div class="identification-options">${optsMal}</div>`;
                case 'unguided': default:
                    return `<p class="task-prompt">How do you spell this sound in Malayalam?</p>
                    <div style="text-align:center;margin-bottom:28px">
                        <button class="id-big-sound" onclick="playAudio('${t.char.iso15919}',this)">🔊</button>
                    </div>
                    <div class="identification-options">${optsMal}</div>`;
            }
        }

        function buildMatching(t) {
            const lefts  = shuffle([...t.chars]);
            const rights = shuffle([...t.chars]);
            const soundL = c =>
                `<div class="pm-card" data-key="${c.iso15919}" data-side="left" data-sound="true" onclick="selectPM(this)">
                    <span class="pm-snd">🔊</span></div>`;
            const romanL = c =>
                `<div class="pm-card" data-key="${c.iso15919}" data-side="left" onclick="selectPM(this)">
                    <span class="pm-roman">${c.iso15919}</span></div>`;
            const romanSoundL = c =>
                `<div class="pm-card" data-key="${c.iso15919}" data-side="left" onclick="selectPM(this)">
                    <span class="pm-roman">${c.iso15919}</span>
                    <span class="pm-snd" onclick="event.stopPropagation();playAudio('${c.iso15919}',this)">🔊</span></div>`;
            const letterR = c =>
                `<div class="pm-card" data-key="${c.iso15919}" data-side="right" onclick="selectPM(this)">
                    <span class="pm-letter">${c.malayalam}</span></div>`;
            const romanR = c =>
                `<div class="pm-card" data-key="${c.iso15919}" data-side="right" onclick="selectPM(this)">
                    <span class="pm-roman">${c.iso15919}</span></div>`;
            let prompt, lHtml, rHtml;
            switch (t.variant) {
                case 'guided':
                    prompt = 'Match each sound and romanization to its letter';
                    lHtml = lefts.map(romanSoundL).join(''); rHtml = rights.map(letterR).join(''); break;
                case 'reducedA':
                    prompt = 'Match the sound to its romanization';
                    lHtml = lefts.map(soundL).join('');  rHtml = rights.map(romanR).join(''); break;
                case 'reducedB':
                    prompt = 'Match the romanization to its letter';
                    lHtml = lefts.map(romanL).join('');  rHtml = rights.map(letterR).join(''); break;
                case 'unguided': default:
                    prompt = 'Match the sound to its letter';
                    lHtml = lefts.map(soundL).join('');  rHtml = rights.map(letterR).join(''); break;
            }
            return `<p class="task-prompt">${prompt}</p>
            <div class="practice-match-cols">
                <div class="practice-match-col" id="pmLeft">${lHtml}</div>
                <div class="practice-match-col" id="pmRight">${rHtml}</div>
            </div>
            <div id="pmMsg"></div>`;
        }

        function initPM(t) {
            ps.pmPairs   = t.chars.map(c => c.iso15919);
            ps.pmMatched = new Set();
            ps.pmSel     = null;
            ps.pmVariant = t.variant;
        }

        function selectPM(el) {
            if (el.classList.contains('pm-matched')) return;
            const side = el.dataset.side;
            if (el.dataset.sound === 'true') playAudio(el.dataset.key);
            if (ps.pmSel && ps.pmSel.dataset.side === side) ps.pmSel.classList.remove('pm-selected');
            el.classList.add('pm-selected');
            ps.pmSel = el;
            const allSel = document.querySelectorAll('.pm-card.pm-selected');
            if (allSel.length === 2) {
                const [a, b] = allSel;
                if (a.dataset.key === b.dataset.key) {
                    a.classList.replace('pm-selected','pm-matched');
                    b.classList.replace('pm-selected','pm-matched');
                    ps.pmMatched.add(a.dataset.key);
                    ps.pmSel = null;
                    if (ps.pmMatched.size === ps.pmPairs.length) {
                        document.getElementById('pmMsg').innerHTML = '<div class="pm-complete">✓ All matched!</div>';
                        setTimeout(() => showFeedback(true, null), 700);
                    }
                } else {
                    a.classList.add('pm-wrong'); b.classList.add('pm-wrong');
                    ps.pmSel = null;
                    setTimeout(() => { a.classList.remove('pm-selected','pm-wrong'); b.classList.remove('pm-selected','pm-wrong'); }, 500);
                }
            }
        }

        function buildHandwriting(t) {
            const halfCls = t.variant === 'half'
                ? (t.side === 'right' ? ' ghost-right' : ' ghost-left') : '';
            const hint = t.variant === 'half'
                ? (t.side === 'right' ? ': left half shown, complete the right'
                                      : ': right half shown, complete the left')
                : '';
            // Ghost is always in the DOM; revealed fully after submit for half/none
            const ghostInitStyle = t.variant === 'none' ? ' style="display:none"' : '';
            // Reference above canvas: large char only for full guide; roman+sound for half/none
            const refHtml = t.variant === 'full'
                ? `<div class="hw-target">${t.char.malayalam}</div>
                   <div class="hw-sublabel">${t.char.iso15919}</div>`
                : `<div class="hw-ref-row">
                       <span class="hw-ref-roman">${t.char.iso15919}</span>
                       <button class="id-sound-btn" onclick="playAudio('${t.char.iso15919}',this)">🔊</button>
                   </div>`;
            return `<p class="task-prompt">Write this character${hint}</p>
            <div class="hw-task">
                ${refHtml}
                <div class="canvas-wrapper">
                    <div class="ghost-letter${halfCls}" id="hwGhost"${ghostInitStyle}>${t.char.malayalam}</div>
                    <canvas id="hwCanvas" width="320" height="320"></canvas>
                </div>
                <div class="canvas-controls" id="canvasControls">
                    <button class="btn-clear" onclick="clearCanvas()">Clear</button>
                    <button class="btn-submit-hw" onclick="submitHW()">Submit</button>
                </div>
                <div class="hw-selfeval" id="hwSelfEval">
                    <div class="hw-selfeval-lbl">Compare with the full guide. How did you do?</div>
                    <div class="hw-selfeval-btns">
                        <button class="btn-got-it" onclick="hwEval(true)">✓ Got it</button>
                        <button class="btn-missed"  onclick="hwEval(false)">✗ Missed it</button>
                    </div>
                </div>
            </div>`;
        }

        function buildTransliteration(t) {
            return `<p class="task-prompt">Type the romanization for this letter</p>
            <div class="hw-task">
                <div class="hw-target">${t.char.malayalam}</div>
                <div class="translit-area">
                    <div class="translit-display" id="translitDisplay">_</div>
                </div>
                <div class="translit-keyboard">
                    ${t.keyboard.map(k => `<button class="translit-key" onclick="translitTap('${k}')">${k}</button>`).join('')}
                    <button class="translit-key translit-back" onclick="translitBack()">⌫</button>
                </div>
                <button class="btn-submit-hw" onclick="checkTranslit('${t.char.iso15919}')">Check</button>
            </div>`;
        }

        function buildRecognition(t) {
            return `<p class="task-prompt">Find the letter in a word</p>
            <div class="recognition-placeholder">
                <div style="font-size:44px">🔍</div>
                <div style="font-size:52px;margin:4px 0">${t.char.malayalam}</div>
                <div style="font-size:13px;color:#7A6A55;max-width:260px;line-height:1.5">
                    You'll see a Malayalam word and tap the character <strong>${t.char.iso15919}</strong> inside it.
                </div>
                <div style="font-size:12px;color:#C8B89A;margin-top:2px">Full task coming soon</div>
                <button class="btn-primary" style="margin-top:20px;width:200px" onclick="skipRecognition()">Continue →</button>
            </div>`;
        }

        function selectVowelMatch(id, pairIdx, side) {
            const state = window['introMatch_' + id];
            if (!state) return;

            const allBtns = document.querySelectorAll(`[data-id="${id}"]`);
            const btn = document.querySelector(`[data-id="${id}"][data-pair="${pairIdx}"].intro-match-${side === 'L' ? 'left' : 'right'}`);

            if (side === 'L') {
                allBtns.forEach(b => b.classList.remove('selected-left'));
                btn.classList.add('selected-left');
                state.selectedL = pairIdx;
                btn.style.borderColor = '#E8720C';
                btn.style.background = '#FFF0D9';
            } else {
                allBtns.forEach(b => b.classList.remove('selected-right'));
                btn.classList.add('selected-right');
                state.selectedR = pairIdx;
                btn.style.borderColor = '#E8720C';
                btn.style.background = '#FFF0D9';
            }

            // Both sides selected - check match
            if (state.selectedL !== undefined && state.selectedR !== undefined) {
                const correct = state.selectedL === state.selectedR;
                const statusEl = document.getElementById(id + '-status');

                if (correct) {
                    // Correct match!
                    state.matched++;
                    const leftBtn = document.querySelector(`[data-id="${id}"][data-pair="${state.selectedL}"].intro-match-left`);
                    const rightBtn = document.querySelector(`[data-id="${id}"][data-pair="${state.selectedR}"].intro-match-right`);
                    leftBtn.style.borderColor = '#1A7A6E'; leftBtn.style.background = '#d1fae5'; leftBtn.disabled = true;
                    rightBtn.style.borderColor = '#1A7A6E'; rightBtn.style.background = '#d1fae5'; rightBtn.disabled = true;
                    statusEl.innerHTML = `<span style="color:#1A7A6E;font-weight:600">✓ Correct!</span>`;
                    state.selectedL = undefined; state.selectedR = undefined;

                    // All matched?
                    if (state.matched === state.pairs) {
                        setTimeout(() => {
                            statusEl.innerHTML = `<button class="btn-secondary" onclick="nextStep()" style="margin-top:8px">Next →</button>`;
                        }, 400);
                    }
                } else {
                    // Wrong match
                    statusEl.innerHTML = `<span style="color:#C0392B;font-weight:600">✗ Try again</span>`;
                    setTimeout(() => {
                        allBtns.forEach(b => { b.classList.remove('selected-left','selected-right'); b.style.borderColor='#E8D5A3'; b.style.background='white'; });
                        state.selectedL = undefined; state.selectedR = undefined;
                        statusEl.innerHTML = '';
                    }, 600);
                }
            }
        }

        function initCanvas() {
            const canvas = document.getElementById('hwCanvas');
            if (!canvas) return;
            hwCtx = canvas.getContext('2d');
            hwCtx.strokeStyle = '#2D2417'; hwCtx.lineWidth = 3;
            hwCtx.lineCap = 'round'; hwCtx.lineJoin = 'round';
            hwDrawing = false; hwHasStrokes = false;
            function pos(e) {
                const r = canvas.getBoundingClientRect();
                const s = e.touches ? e.touches[0] : e;
                return { x: s.clientX - r.left, y: s.clientY - r.top };
            }
            canvas.onmousedown = canvas.ontouchstart = e => {
                e.preventDefault(); hwDrawing = true; hwHasStrokes = true;
                const p = pos(e); hwCtx.beginPath(); hwCtx.moveTo(p.x, p.y);
            };
            canvas.onmousemove = canvas.ontouchmove = e => {
                e.preventDefault(); if (!hwDrawing) return;
                const p = pos(e); hwCtx.lineTo(p.x, p.y); hwCtx.stroke();
            };
            canvas.onmouseup = canvas.ontouchend = canvas.onmouseleave = () => { hwDrawing = false; };
        }

        function clearCanvas() {
            if (!hwCtx) return;
            hwCtx.clearRect(0, 0, 280, 280);
            hwHasStrokes = false;
            document.getElementById('hwSelfEval').classList.remove('visible');
            document.getElementById('canvasControls').style.display = 'flex';
        }

        function submitHW() {
            if (!hwHasStrokes) { showToast('✏️ Draw the character first'); return; }
            // Reveal full ghost for self-comparison (remove half-clip, show if hidden)
            const ghost = document.getElementById('hwGhost');
            if (ghost) {
                ghost.style.display = '';
                ghost.classList.remove('ghost-left', 'ghost-right');
            }
            document.getElementById('hwSelfEval').classList.add('visible');
            document.getElementById('canvasControls').style.display = 'none';
        }

        function hwEval(gotIt) {
            ps.totalAnswered++;
            if (gotIt) {
                ps.correctCount++;
            } else {
                ps.wrongQueue.push({ ...ps.tasks[ps.currentIndex] });
            }
            continuePractice();
        }

        function answerDisc(chosen, correct, el) {
            const isCorrect = chosen === correct;
            document.querySelectorAll('.discrimination-btn').forEach(b => {
                b.disabled = true;
                if (b.textContent.trim().toLowerCase() === correct) b.classList.add('disc-correct');
                else if (b === el && !isCorrect) b.classList.add('disc-wrong');
            });
            if (!isCorrect) ps.wrongQueue.push({ ...ps.tasks[ps.currentIndex] });
            const t = ps.tasks[ps.currentIndex];
            showFeedback(isCorrect, isCorrect ? null : `They are ${correct}: ${t.c1.iso15919} and ${t.c2.iso15919}`);
        }

        function answerIdent(chosen, correct, el) {
            const isCorrect = chosen === correct;
            document.querySelectorAll('.id-option').forEach(b => {
                b.disabled = true;
                if (b.dataset.val === correct) b.classList.add('id-correct');
                else if (b === el && !isCorrect) b.classList.add('id-wrong');
            });
            if (!isCorrect) ps.wrongQueue.push({ ...ps.tasks[ps.currentIndex] });
            showFeedback(isCorrect, isCorrect ? null : `Correct: ${correct}`);
        }

        function translitTap(ch) {
            ps.translitBuffer = (ps.translitBuffer || '') + ch;
            const d = document.getElementById('translitDisplay');
            if (d) d.textContent = ps.translitBuffer || '_';
        }

        function translitBack() {
            ps.translitBuffer = (ps.translitBuffer || '').slice(0, -1);
            const d = document.getElementById('translitDisplay');
            if (d) d.textContent = ps.translitBuffer || '_';
        }

        function checkTranslit(correct) {
            const isCorrect = (ps.translitBuffer || '') === correct;
            if (!isCorrect) ps.wrongQueue.push({ ...ps.tasks[ps.currentIndex] });
            document.querySelectorAll('.translit-key').forEach(b => b.disabled = true);
            const d = document.getElementById('translitDisplay');
            if (d) d.style.color = isCorrect ? '#1A7A6E' : '#C0392B';
            showFeedback(isCorrect, isCorrect ? null : `Correct: ${correct}`);
        }

        function skipTask() {
            document.getElementById('practiceFeedback').className = 'feedback-bar fb-hidden';
            // Handwriting tasks that are skipped without submission go back into the queue
            // so the session doesn't silently end — they'll reappear at the tail.
            const currentTask = ps.tasks[ps.currentIndex];
            if (currentTask && currentTask.type === 'handwriting') {
                ps.wrongQueue.push({ ...currentTask });
            }
            ps.currentIndex++;
            if (ps.currentIndex >= ps.tasks.length && ps.wrongQueue.length > 0) {
                ps.tasks = [...ps.tasks, ...ps.wrongQueue]; ps.wrongQueue = [];
            }
            renderPracticeTask();
        }

        function previousPractice() {
            if (ps.currentIndex > 0) {
                document.getElementById('practiceFeedback').className = 'feedback-bar fb-hidden';
                ps.currentIndex--;
                renderPracticeTask();
            }
        }

        function skipRecognition() { skipTask(); }

        function showFeedback(isCorrect, sub) {
            ps.totalAnswered++;
            if (isCorrect) ps.correctCount++;
            const bar = document.getElementById('practiceFeedback');
            document.getElementById('feedbackMsg').textContent = isCorrect ? '✓ Correct!' : '✗ Incorrect';

        function finishPractice() {
            markLessonComplete(currentModuleId, currentLessonId);

            if (ps.totalAnswered > 0) {
                try {
                    const stored = JSON.parse(localStorage.getItem(ACCURACY_KEY) || '{}');
                    stored.answered = (stored.answered || 0) + ps.totalAnswered;
                    stored.correct  = (stored.correct  || 0) + ps.correctCount;
                    localStorage.setItem(ACCURACY_KEY, JSON.stringify(stored));
                } catch(e) {}
            }
            const acc = ps.totalAnswered > 0 ? Math.round(ps.correctCount / ps.totalAnswered * 100) : null;

            document.getElementById('taskSkipRow').style.display = 'none';
            document.getElementById('practiceFeedback').className = 'feedback-bar fb-hidden';
