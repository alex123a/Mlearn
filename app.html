        function playAudio(iso, btn) {
            if (btn) {
                const orig = btn.style.background;
                btn.style.background = '#FFF0D9';
                setTimeout(() => btn.style.background = orig, 400);
            }
            // 1. Admin-set custom path
            const custom = localStorage.getItem('audio_' + iso);
            if (custom) { new Audio(custom).play().catch(() => {}); return; }
            // 2. Web Speech API — called DIRECTLY here, not inside a Promise
            //    callback, so iOS Safari and Android treat it as a user gesture.
            //    (Calling speak() from inside .catch() breaks iOS user-gesture
            //    detection and causes silent failure.)
            const text = isoToMalayalam[iso] || iso;
            speakMalayalam(text, 0.85);
            // 3. If local MP3 files are ever added, they will be tried
            //    asynchronously; if they succeed they play alongside (or
            //    override) the speech — add local file support here later.
        }

        function audioInputChange(iso, input) {

        function audioSaveRow(iso) {
            const input = document.getElementById('ainput_' + iso);
            const val = input ? input.value.trim() : '';
            const dot = document.getElementById('adot_' + iso);
            if (val && !val.startsWith('✓')) {
                localStorage.setItem('audio_' + iso, val);
                if (dot) { dot.className = 'audio-status-dot custom'; }
            } else if (!val) {
                localStorage.removeItem('audio_' + iso);
                if (dot) { dot.className = 'audio-status-dot missing'; }
            }
            showToast('Saved: ' + iso);
        }

        function audioHandleUpload(iso, fileInput) {
            const file = fileInput.files[0];
            if (!file) return;
            if (file.size > 800 * 1024) { showToast('File too large — keep under 800 KB'); return; }
            const reader = new FileReader();
            reader.onload = e => {
                try { localStorage.setItem('audio_' + iso, e.target.result); }
                catch(err) { showToast('Storage full — clear some uploads first'); return; }
                const input = document.getElementById('ainput_' + iso);
                if (input) { input.value = '✓ Uploaded: ' + file.name; input.disabled = true; input.className = 'audio-file-input has-custom is-uploaded'; }
                const dot = document.getElementById('adot_' + iso);
                if (dot) dot.className = 'audio-status-dot uploaded';
                audioUpdateStorageBar();
                showToast('Uploaded: ' + file.name);
            };
            reader.readAsDataURL(file);
        }

        function audioClearUpload(iso) {
            localStorage.removeItem('audio_' + iso);
            // Re-render audio manager to reflect cleared state
            const el = document.getElementById('stab-audio');
            delete el.dataset.rendered;
            renderAudioManager();
            showToast('Cleared: ' + iso);
        }

        function audioTestPlay(iso, btn) {
            const stored = localStorage.getItem('audio_' + iso);
            if (stored) {
                btn.classList.add('playing');
                const a = new Audio(stored);
                a.play().then(() => { a.onended = () => btn.classList.remove('playing'); })
                        .catch(() => { btn.classList.remove('playing'); showToast('Could not play file'); });
            } else {
                // Use speech synthesis
                const text = isoToMalayalam[iso] || iso;
                speakMalayalam(text, 0.85);
                btn.classList.add('playing');
                setTimeout(() => btn.classList.remove('playing'), 800);
            }
        }

            const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'audio-config.json'; a.click();

            if (!mod) return;
            const les = mod.lessons.find(l => l.id === lesId);
            if (!les) return;
            les[field] = value;
            showToast('Saved');
        }

        function contentDeleteLesson(modId, lesId) {
            if (!confirm('Delete this lesson? This cannot be undone until you reload the page.')) return;
            const mod = modulesData.find(m => m.id === modId);
            if (!mod) return;
            mod.lessons = mod.lessons.filter(l => l.id !== lesId);
            mod.totalLessons = mod.lessons.length;
            // Remove block from DOM
            const block = document.getElementById('cblock_' + modId + '_' + lesId);
            if (block) block.remove();
            // Update meta
            const meta = document.querySelector('#cmod_' + modId + ' .content-module-meta');
            if (meta) meta.textContent = mod.lessons.length + ' lessons · ' + (mod.description || '');
            showToast('Lesson deleted');
        }

        // ── Content lesson expand ─────────────────────────────────────────
        function toggleContentLesson(modId, lesId) {
            const block = document.getElementById('cblock_' + modId + '_' + lesId);
            if (block) block.classList.toggle('open');
        }

        // HTML-escape helper for generating safe inline HTML
        function he(s) {
            return (s == null ? '' : String(s))
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // Split textarea value into array (used by options/taskMix handlers)
        function taLines(ta) { return ta.value.split('\n').filter(s => s.trim()); }

        // Build the editable detail panel HTML for one lesson
        function renderLessonContentHTML(les, modId) {
            const c = les.content || {};
            let html = '';

            // Introduction: direct characters array
            if (c.characters && c.characters.length) {
                html += contentCharsTableHTML(c.characters, modId, les.id, 'contentEditCharField');
            }

            // Introduction: multi-step (steps[])
            if (c.steps && c.steps.length) {
                c.steps.forEach((step, si) => {
                    html += `<div class="content-step-block">
                        <div class="content-section-label" style="color:#E8720C">Step ${si + 1}</div>
                        <div class="content-field-label">Heading</div>
                        <input class="content-field-input" value="${he(step.heading)}"
                            onchange="contentEditStepField(${modId},${les.id},${si},'heading',this.value)" />`;
                    if (step.characters && step.characters.length) {
                        html += contentCharsTableHTML(step.characters, modId, les.id, 'contentEditStepCharField', si);
                    }
                    if (step.embeddedTask) {
                        html += embeddedTaskBlockHTML(step.embeddedTask, modId, les.id, 'contentEditStepTask', si);
                    }
                    html += '</div>';
                });
            }

            // Insight (shared by introduction types)
            if (c.insight !== undefined) {
                html += `<div class="content-field-label">Insight</div>
                    <textarea class="content-field-input"
                        onchange="contentEditContentField(${modId},${les.id},'insight',this.value)">${he(c.insight)}</textarea>`;
            }

            // Top-level embedded task
            if (c.embeddedTask) {
                html += embeddedTaskBlockHTML(c.embeddedTask, modId, les.id, 'contentEditRootTask', -1);
            }

            // Practice: scaffold dropdown + behaviour flags
            if (c.scaffold !== undefined) {
                const opts = ['Guided','Reduced guidance','Unguided','Cumulative','Review'];
                html += `<div class="content-field-label">Scaffold level</div>
                    <select class="content-field-input" style="width:auto"
                        onchange="contentEditContentField(${modId},${les.id},'scaffold',this.value)">
                        ${opts.map(s => `<option${s === c.scaffold ? ' selected' : ''}>${he(s)}</option>`).join('')}
                    </select>
                    <div style="display:flex;gap:20px;margin-top:10px;flex-wrap:wrap">
                        <label class="content-flag-label">
                            <input type="checkbox" ${c.skipDiscrimination ? 'checked' : ''}
                                onchange="contentEditContentField(${modId},${les.id},'skipDiscrimination',this.checked)" />
                            Skip discrimination tasks
                        </label>
                        <label class="content-flag-label">
                            <input type="checkbox" ${c.chandrakkalaReview ? 'checked' : ''}
                                onchange="contentEditContentField(${modId},${les.id},'chandrakkalaReview',this.checked)" />
                            Chandrakkala review mode
                        </label>
                    </div>`;
            }

            // Practice: task mix description (metadata only)
            if (c.taskMix) {
                html += `<div class="content-field-label">Task mix description <span style="font-weight:400;text-transform:none;letter-spacing:0">(human-readable — one per line)</span></div>
                    <textarea class="content-field-input content-taskmix-area"
                        onchange="contentEditTaskMix(${modId},${les.id},this.value)">${he((c.taskMix||[]).join('\n'))}</textarea>`;
            }

            // Practice: chars list
            if (c.chars && c.chars.length) {
                html += '<div class="content-field-label">Characters in this practice</div>';
                html += '<table class="content-chars-table"><thead><tr><th>Script</th><th>ISO</th></tr></thead><tbody>';
                c.chars.forEach((ch, ci) => {
                    html += `<tr>
                        <td><div class="content-char-glyph">${he(ch.malayalam)}</div></td>
                        <td><input class="content-field-input" style="width:90px" value="${he(ch.iso15919)}"
                            onchange="contentEditPracticeCharField(${modId},${les.id},${ci},'iso15919',this.value)" /></td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }

            // Practice: live generated-task preview
            if (c.scaffold !== undefined || c.chars) {
                html += `<div class="content-field-label" style="margin-top:16px">Generated tasks
                    <span style="font-weight:400;text-transform:none;letter-spacing:0">(live sample — order randomised per session)</span>
                </div>`;
                html += renderTaskPreviewHTML(les);
            }

            // Reading: words table
            if (c.words && c.words.length) {
                html += '<div class="content-field-label">Words</div>';
                html += '<table class="content-chars-table"><thead><tr><th>Script</th><th>ISO</th><th>Meaning</th><th>Note</th></tr></thead><tbody>';
                c.words.forEach((w, wi) => {
                    html += `<tr>
                        <td><div class="content-char-glyph" style="font-size:20px">${he(w.malayalam)}</div></td>
                        <td><input class="content-field-input" style="width:72px" value="${he(w.iso)}"
                            onchange="contentEditWordField(${modId},${les.id},${wi},'iso',this.value)" /></td>
                        <td><input class="content-field-input" value="${he(w.meaning)}"
                            onchange="contentEditWordField(${modId},${les.id},${wi},'meaning',this.value)" /></td>
                        <td><input class="content-field-input" style="font-size:11px" value="${he(w.unknown)}"
                            onchange="contentEditWordField(${modId},${les.id},${wi},'unknown',this.value)" /></td>
                    </tr>`;
                });
                html += '</tbody></table>';
            }

            if (!html) html = '<p style="color:#C8B89A;font-size:12px;margin:0">No editable content fields for this lesson.</p>';
            return html;
        }

        // Live task preview for practice/review/reading lessons
        function renderTaskPreviewHTML(les) {
            let tasks;
            try { tasks = generateTasks(les); } catch(e) {
                return `<p style="color:#C0392B;font-size:12px;margin:4px 0">Could not generate tasks: ${he(e.message)}</p>`;
            }
            if (!tasks || !tasks.length) return '<p style="color:#C8B89A;font-size:12px;margin:4px 0">No tasks generated.</p>';

            const COL = {
                discrimination:'#E8720C', identification:'#0891b2',
                matching:'#0F6E56', transliteration:'#7A4E8A',
                handwriting:'#C8922A', overview:'#7A6A55'
            };
            const ML = "font-family:'Noto Sans Malayalam',sans-serif";

            let html = `<table class="content-chars-table"><thead><tr>
                <th style="width:28px">#</th><th>Type</th><th>Detail</th>
            </tr></thead><tbody>`;

            tasks.forEach((t, i) => {
                let detail = '';
                switch (t.type) {
                    case 'discrimination':
                        detail = `<span style="${ML}">${he(t.c1.malayalam)}</span> vs <span style="${ML}">${he(t.c2.malayalam)}</span> → <strong>${t.answer}</strong>`;
                        break;
                    case 'identification':
                        detail = `${he(t.variant)} · target <span style="${ML}">${he(t.char.malayalam)}</span> (${he(t.char.iso15919)}) · ${(t.options||[]).length} options`;
                        break;
                    case 'matching':
                        detail = `${he(t.variant)} · ${t.chars.length} pairs: <span style="${ML}">${t.chars.map(c=>he(c.malayalam)).join(' ')}</span>`;
                        break;
                    case 'transliteration':
                        detail = `type ISO for <span style="${ML}">${he(t.char.malayalam)}</span> · keyboard: ${(t.keyboard||[]).join(' ')}`;
                        break;
                    case 'handwriting':
                        detail = `${he(t.variant)}${t.side ? ' ('+he(t.side)+' side)' : ''} · <span style="${ML};font-size:20px">${he(t.char.malayalam)}</span> (${he(t.char.iso15919)})`;
                        break;
                    case 'overview':
                        detail = `${(t.chars||[]).length} characters overview card`;
                        break;
                    default:
                        detail = he(t.type);
                }
                const col = COL[t.type] || '#7A6A55';
                html += `<tr class="content-task-preview-row">
                    <td style="font-size:11px;color:#C8B89A">${i+1}</td>
                    <td><span class="content-task-type-chip" style="color:${col};background:${col}18">${he(t.type)}</span></td>
                    <td style="font-size:12px;color:#2D2417">${detail}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            return html;
        }

        // Characters table block
        function contentCharsTableHTML(chars, modId, lesId, editFn, stepIdx) {
            let html = '<div class="content-field-label">Characters</div>';
            html += '<table class="content-chars-table"><thead><tr><th>Script</th><th>ISO</th><th>Description</th></tr></thead><tbody>';
            chars.forEach((ch, ci) => {
                const a = stepIdx !== undefined ? `${modId},${lesId},${stepIdx},${ci}` : `${modId},${lesId},${ci}`;
                html += `<tr>
                    <td><div class="content-char-glyph">${he(ch.malayalam)}</div></td>
                    <td><input class="content-field-input" style="width:72px" value="${he(ch.iso15919)}"
                        onchange="${editFn}(${a},'iso15919',this.value)" /></td>
                    <td><input class="content-field-input" value="${he(ch.description)}"
                        onchange="${editFn}(${a},'description',this.value)" /></td>
                </tr>`;
            });
            html += '</tbody></table>';
            return html;
        }

        // Embedded task (Quick Check) block
        function embeddedTaskBlockHTML(task, modId, lesId, editFn, stepIdx) {
            const a = stepIdx >= 0 ? `${modId},${lesId},${stepIdx}` : `${modId},${lesId}`;
            return `<div class="content-task-block">
                <div class="content-section-label" style="color:#0891b2">Quick Check</div>
                <div class="content-field-label">Prompt</div>
                <input class="content-field-input" value="${he(task.prompt)}"
                    onchange="${editFn}(${a},'prompt',this.value)" />
                <div class="content-field-label">Options <span style="font-weight:400;text-transform:none;letter-spacing:0">(one per line)</span></div>
                <textarea class="content-field-input content-taskmix-area"
                    onchange="${editFn}(${a},'options',taLines(this))">${he((task.options||[]).join('\n'))}</textarea>
                <div class="content-field-label">Correct answer (0-based index)</div>
                <input class="content-field-input" type="number" min="0" style="width:80px" value="${task.correct||0}"
                    onchange="${editFn}(${a},'correct',+this.value)" />
            </div>`;
        }

        // ── Deep edit handlers ────────────────────────────────────────────
        function contentEditContentField(modId, lesId, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            if (!les) return;
            (les.content = les.content || {})[field] = value;
            showToast('Saved');
        }
        function contentEditTaskMix(modId, lesId, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            if (les && les.content) { les.content.taskMix = value.split('\n').filter(s => s.trim()); showToast('Saved'); }
        }
        function contentEditCharField(modId, lesId, ci, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const ch = les && les.content && les.content.characters && les.content.characters[ci];
            if (ch) { ch[field] = value; showToast('Saved'); }
        }
        function contentEditStepField(modId, lesId, si, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const step = les && les.content && les.content.steps && les.content.steps[si];
            if (step) { step[field] = value; showToast('Saved'); }
        }
        function contentEditStepCharField(modId, lesId, si, ci, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const step = les && les.content && les.content.steps && les.content.steps[si];
            const ch = step && step.characters && step.characters[ci];
            if (ch) { ch[field] = value; showToast('Saved'); }
        }
        function contentEditPracticeCharField(modId, lesId, ci, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const ch = les && les.content && les.content.chars && les.content.chars[ci];
            if (ch) { ch[field] = value; showToast('Saved'); }
        }
        function contentEditWordField(modId, lesId, wi, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const w = les && les.content && les.content.words && les.content.words[wi];
            if (w) { w[field] = value; showToast('Saved'); }
        }
        function contentEditRootTask(modId, lesId, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const task = les && les.content && les.content.embeddedTask;
            if (task) { task[field] = value; showToast('Saved'); }
        }
        function contentEditStepTask(modId, lesId, si, field, value) {
            const mod = modulesData.find(m => m.id === modId);
            const les = mod && mod.lessons.find(l => l.id === lesId);
            const step = les && les.content && les.content.steps && les.content.steps[si];
            const task = step && step.embeddedTask;
            if (task) { task[field] = value; showToast('Saved'); }
        }
    </script>

    <!-- Bottom Navigation (mobile only) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="bottom-nav-inner">
            <button class="bottom-tab active" data-tab="learn" onclick="switchTab('learn')">
                <span class="bottom-tab-icon">
                    <i class="ph ph-book-open tab-icon-regular"></i>
                    <i class="ph-fill ph-book-open-fill tab-icon-fill"></i>
                </span>
                <span class="bottom-tab-label">Learn</span>
            </button>
            <button class="bottom-tab" data-tab="revise" onclick="switchTab('revise')">
                <span class="bottom-tab-icon">
                    <i class="ph ph-arrows-clockwise tab-icon-regular"></i>
                    <i class="ph-fill ph-arrows-clockwise tab-icon-fill"></i>
                </span>
                <span class="bottom-tab-label">Revise</span>
            </button>
            <button class="bottom-tab" data-tab="progress" onclick="switchTab('progress')">
                <span class="bottom-tab-icon">
                    <i class="ph ph-chart-bar tab-icon-regular"></i>
                    <i class="ph-fill ph-chart-bar-fill tab-icon-fill"></i>
                </span>
                <span class="bottom-tab-label">Progress</span>
            </button>
        </div>
    </div>
</body>
</html>
